[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "2.0.0"
description = "Norwegian Company Intelligence Agent for Builderr Leaderboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Signalpost Team"}
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
signalpost = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
